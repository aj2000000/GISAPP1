<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#00b0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0088cc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
  </defs>

  <!-- Outer Pulse Halo -->
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>

  <!-- Tactical Hex Shield -->
  <polygon points="32,6 54,19 54,45 32,58 10,45 10,19"
           fill="#0a192f"
           stroke="url(#metal)"
           stroke-width="3"
           stroke-linejoin="round"/>

  <!-- Inner Tech Ring -->
  <circle cx="32" cy="32" r="14"
          fill="none"
          stroke="#00e5ff"
          stroke-width="1.8"
          stroke-dasharray="4 2"/>

  <!-- Crosshairs -->
  <line x1="32" y1="12" x2="32" y2="19" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="45" x2="32" y2="52" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="19" y2="32" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="45" y1="32" x2="52" y2="32" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>

  <!-- Center Sensor Beacon -->
  <circle cx="32" cy="32" r="5" fill="#00e5ff"/>
  <circle cx="32" cy="32" r="2.5" fill="#ffffff"/>
</svg>
